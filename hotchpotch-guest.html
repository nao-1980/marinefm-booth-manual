<html lang="ja">
<head>
<meta charset="utf-8">

<title>ホッチポッチ ゲスト台本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 12:30〜16時台の台本。ゲスト欄は開閉式で入力、閉じても名前が見え、台本中の【　】にも自動で入る */
:root{
  --bg:#f3f5f8; --surface:#fff; --fg:#14213a; --muted:#5b6780; --line:#d9dfe8;
  --navy:#173a6b; --rain:#c62828; --rain-bg:#fdecec; --blue:#0057d9; --blue-bg:#eaf1fd;
  --gold:#a85d00; --gold-bg:#fff4e2; --ok:#1f7a4d; --ok-bg:#e7f5ee;
  --f-head:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#172131; --fg:#e7ecf4; --muted:#9aa6bb; --line:#2a3850;
  --navy:#8fb4ea; --rain:#ff8a80; --rain-bg:#3a1c1c; --blue:#7fb0ff; --blue-bg:#16263f;
  --gold:#f4b660; --gold-bg:#3a2a12; --ok:#6fd0a0; --ok-bg:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#172131; --fg:#e7ecf4; --muted:#9aa6bb; --line:#2a3850;
  --navy:#8fb4ea; --rain:#ff8a80; --rain-bg:#3a1c1c; --blue:#7fb0ff; --blue-bg:#16263f;
  --gold:#f4b660; --gold-bg:#3a2a12; --ok:#6fd0a0; --ok-bg:#16301f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
header h1{font-family:var(--f-head);font-weight:900;font-size:1.4rem;margin:0;color:var(--navy);text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;margin-bottom:6px}
.prog{display:flex;align-items:center;gap:10px}
.track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width .2s}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:.88rem;white-space:nowrap}
.sync{font-size:.72rem;color:var(--muted);white-space:nowrap}
.roster{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.roster a{text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:4px 8px;font-size:.76rem;line-height:1.35;flex:none;width:150px}
.roster a.ok{border-left-color:var(--ok)}
.roster a b{color:var(--navy);font-variant-numeric:tabular-nums;margin-right:4px}
.roster a span{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster a span.empty{color:var(--muted);font-weight:500}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;scroll-margin-top:120px}
section>h2{margin:0;padding:10px 14px;font-family:var(--f-head);font-size:1.15rem;color:var(--navy);border-bottom:2px solid var(--navy)}
.row{display:grid;grid-template-columns:3.6em 1fr;gap:0 10px;padding:5px 14px}
.row.cue{border-top:1px solid var(--line);margin-top:2px;padding-top:8px}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:.82rem;color:var(--navy);line-height:1.9}
.tm span{display:block;font-weight:500;color:var(--muted);font-size:.72rem;line-height:1.2}
.c{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.n{display:block;font-size:.76rem;color:var(--muted)}
.row.hd .c{font-weight:700;color:var(--navy)}
.row.r{background:var(--rain-bg)} .row.r .c{color:var(--rain);font-weight:700}
.row.b .c{color:var(--blue);font-weight:700}
.gap{height:8px}
mark.nm{background:var(--gold-bg);color:var(--gold);font-weight:900;padding:0 3px;border-radius:3px}
mark.nm.ok{background:var(--ok-bg);color:var(--ok)}
details.gst{margin:6px 10px;border:2px solid var(--gold);border-radius:8px;background:var(--gold-bg);scroll-margin-top:120px}
details.gst.done{border-color:var(--ok);background:var(--ok-bg)}
details.gst>summary{list-style:none;cursor:pointer;padding:9px 10px 9px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start}
details.gst>summary::-webkit-details-marker{display:none}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-top:3px;background:var(--surface);color:var(--gold);border:1px solid var(--gold)}
details.gst.done .badge{background:var(--ok);color:#fff;border-color:var(--ok)}
.st{min-width:0}
.st .ttl{display:block;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.st .org{display:block;font-weight:700;color:var(--navy)}
.st .who{display:block;font-size:1.05rem;font-weight:900;margin-top:2px;overflow-wrap:anywhere}
.st .who.empty{font-size:.85rem;font-weight:500;color:var(--muted)}
.st .mm{display:block;font-size:.8rem;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.st .mm:empty{display:none}
details[open] .st .who,details[open] .st .mm{display:none}
.chev{color:var(--muted);transition:transform .15s;margin-top:3px}
details[open] .chev{transform:rotate(180deg)}
.body{padding:0 12px 12px;display:grid;gap:8px}
.body label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.body input,.body textarea{width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.body textarea{min-height:56px;resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;font-weight:700;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--ok);background:var(--ok);color:#fff}
.btn.sub{background:var(--surface);color:var(--muted);border-color:var(--line)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
footer{color:var(--muted);font-size:.78rem;margin-top:8px}
.send{display:block;width:100%;font:inherit;font-weight:900;font-size:1rem;padding:12px;border:0;border-radius:10px;background:#06c755;color:#fff;cursor:pointer;margin-top:4px}
.topsend{margin-left:auto;font:inherit;font-size:.78rem;font-weight:700;border:0;border-radius:999px;padding:4px 12px;background:#06c755;color:#fff;cursor:pointer;white-space:nowrap}
</style>

function textWithMarks(c,h){
