<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ホッチポッチ当日台本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 1カラムの当日台本。上部に確認状況バー＋時間帯タブ、本文は台本行。確認事項(青)は開閉式で入力、閉じても状態とメモが見える */
:root{
  --bg:#f3f5f8; --surface:#fff; --fg:#14213a; --muted:#5b6780; --line:#d9dfe8;
  --navy:#173a6b; --rain:#c62828; --rain-bg:#fdecec; --blue:#0057d9; --blue-bg:#eaf1fd;
  --ok:#1f7a4d; --ok-bg:#e7f5ee; --warn:#b4540f;
  --f-head:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#172131; --fg:#e7ecf4; --muted:#9aa6bb; --line:#2a3850;
  --navy:#8fb4ea; --rain:#ff8a80; --rain-bg:#3a1c1c; --blue:#7fb0ff; --blue-bg:#16263f;
  --ok:#6fd0a0; --ok-bg:#16301f; --warn:#f0a35e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#172131; --fg:#e7ecf4; --muted:#9aa6bb; --line:#2a3850;
  --navy:#8fb4ea; --rain:#ff8a80; --rain-bg:#3a1c1c; --blue:#7fb0ff; --blue-bg:#16263f;
  --ok:#6fd0a0; --ok-bg:#16301f; --warn:#f0a35e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
header h1{font-family:var(--f-head);font-weight:900;font-size:1.45rem;margin:0;color:var(--navy);text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.legend a{color:var(--gold);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;margin-top:6px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;margin-bottom:6px}
.prog{display:flex;align-items:center;gap:10px}
.track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width .2s}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:.88rem;white-space:nowrap}
.sync{font-size:.72rem;color:var(--muted);white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--navy);background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
nav a .dot{display:inline-block;min-width:1.3em;margin-left:5px;padding:0 5px;border-radius:999px;font-size:.7rem;background:var(--blue-bg);color:var(--blue)}
nav a .dot.ok{background:var(--ok-bg);color:var(--ok)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;scroll-margin-top:150px}
details.sec>summary{list-style:none;cursor:pointer;margin:0;padding:12px 14px;font-family:var(--f-head);font-size:1.15rem;color:var(--navy);font-weight:900;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec[open]>summary{border-bottom:2px solid var(--navy)}
.sm-r{display:flex;align-items:center;gap:8px;font-family:var(--f-body);font-size:.75rem;font-weight:700}
.sm-r .left{background:var(--blue-bg);color:var(--blue);border-radius:999px;padding:1px 8px}
.sm-r .left.ok{background:var(--ok-bg);color:var(--ok)}
.sm-r .gname{color:var(--gold);max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-r .gname.ok{color:var(--ok)}
.sm-r .arw{color:var(--muted);transition:transform .15s}
details.sec[open] .sm-r .arw{transform:rotate(180deg)}
.allbtn{font:inherit;font-size:.75rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer;flex:none}
details.sec>summary small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:3.6em 1fr;gap:0 10px;padding:5px 14px;border-top:1px solid transparent}
.row.cue{border-top-color:var(--line);margin-top:2px;padding-top:8px}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:.82rem;color:var(--navy);line-height:1.9}
.tm span{display:block;font-weight:500;color:var(--muted);font-size:.72rem;line-height:1.2}
.c{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.n{display:block;font-size:.76rem;color:var(--muted)}
.row.hd .c{font-weight:700;color:var(--navy)}
.row.r .c{color:var(--rain);font-weight:700}
.row.r{background:var(--rain-bg)}
.gap{height:8px}
/* 確認事項 */
details.chk{margin:4px 10px;border:1.5px solid var(--blue);border-radius:8px;background:var(--blue-bg)}
details.chk.done{border-color:var(--ok);background:var(--ok-bg)}
details.chk>summary{list-style:none;cursor:pointer;padding:8px 10px 8px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start}
details.chk>summary::-webkit-details-marker{display:none}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-top:2px;background:var(--surface);color:var(--blue);border:1px solid var(--blue)}
details.chk.done .badge{background:var(--ok);color:#fff;border-color:var(--ok)}
.st{min-width:0}
.st b{display:block;font-weight:700;overflow-wrap:anywhere}
.st .tmx{font-variant-numeric:tabular-nums;color:var(--navy);margin-right:6px}
.st .q{display:block;font-size:.76rem;color:var(--muted)}
.st .memo{display:block;font-size:.85rem;font-weight:700;color:var(--ok);margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.st .memo:empty,details[open] .st .memo{display:none}
.chev{color:var(--muted);transition:transform .15s;margin-top:2px}
details[open] .chev{transform:rotate(180deg)}
.body{padding:2px 12px 12px}
.body label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:3px}
.body textarea{width:100%;min-height:64px;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);resize:vertical}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;font-weight:700;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--ok);background:var(--ok);color:#fff}
.btn.sub{background:var(--surface);color:var(--muted);border-color:var(--line)}
.who{font-size:.72rem;color:var(--muted)}
.genl .row{display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
footer{color:var(--muted);font-size:.78rem;margin-top:8px}
:root{--gold:#a85d00;--gold-bg:#fff4e2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#f4b660;--gold-bg:#3a2a12}}
:root[data-theme="dark"]{--gold:#f4b660;--gold-bg:#3a2a12}
.send{display:block;width:100%;font:inherit;font-weight:900;font-size:1rem;padding:12px;border:0;border-radius:10px;background:#06c755;color:#fff;cursor:pointer;margin-top:4px}
.topsend{font:inherit;font-size:.78rem;font-weight:700;border:0;border-radius:999px;padding:4px 12px;background:#06c755;color:#fff;cursor:pointer;white-space:nowrap}
.roster{display:flex;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.roster a{flex:none;width:150px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:3px 8px;font-size:.74rem;line-height:1.35}
.roster a.ok{border-left-color:var(--ok)}
.roster a b{color:var(--navy);margin-right:4px}
.roster a span{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster a span.empty{color:var(--muted);font-weight:500}
mark.nm{background:var(--gold-bg);color:var(--gold);font-weight:900;padding:0 3px;border-radius:3px}
mark.nm.ok{background:var(--ok-bg);color:var(--ok)}
details.gst{border-color:var(--gold);background:var(--gold-bg);border-width:2px}
details.gst .badge{color:var(--gold);border-color:var(--gold)}
details.gst.done{border-color:var(--ok);background:var(--ok-bg)}
.st .ttl{display:block;font-size:.76rem;color:var(--muted)}
.st .who{display:block;color:var(--fg);font-size:1.05rem;font-weight:900;margin-top:2px;overflow-wrap:anywhere}
.st .who.empty{font-size:.85rem;font-weight:500;color:var(--muted)}
details[open] .st .who{display:none}
.body input{width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);margin-bottom:8px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>ホッチポッチ横浜 当日台本</h1>
    <p>11/15(日) 象の鼻パーク｜はまリポ情報部｜雨天版（9:00時点）</p>
    <div class="legend"><span><i style="background:var(--rain)"></i>雨天で変更</span><span><i style="background:var(--blue)"></i>確認事項（タップで開いて入力）</span><span><i style="background:var(--gold)"></i>ゲスト名（入力すると台本の【　】に入る）</span><span><i style="background:var(--ok)"></i>確認済み・確定</span></div>

  <div class="top">

  <div id="main"></div>
  <button class="send" id="send" type="button">確認結果・ゲスト名をLINEで送る</button>
  <footer id="foot">入力はこの端末に保存されます。確認したら「LINEで送る」で共有してください。</footer>
</div>

    const names=gs.map(i=>nameOf(i)).filter(Boolean);
    gn.style.display=gs.length?"":"none"; gn.textContent=gs.length?("ゲスト "+(names.length?names.join("・"):"未入力")):"";
    gn.classList.toggle("ok",gs.length&&gs.every(i=>state[i]&&state[i].done));
  }
}
function totals(){ secs();
  const ids=Object.keys(els); const n=ids.filter(i=>state[i]&&state[i].done).length;
  $("#count").textContent=`${n} / ${ids.length} 確認済み`;
  $("#fill").style.width=(ids.length?n/ids.length*100:0)+"%";
  document.querySelectorAll("nav a").forEach(a=>{
    const ids=groups[a.dataset.sid]||[]; const dot=a.querySelector(".dot");
    if(!ids.length){dot.style.display="none";return}
    const left=ids.filter(i=>!(state[i]&&state[i].done)).length;
    dot.textContent=left?left:"✓"; dot.classList.toggle("ok",!left);
  });
}
function roster(){
  const R=$("#roster"); R.textContent="";
  Object.keys(G).forEach(id=>{const v=state[id]||{};const a=mk("a",v.done?"ok":"");a.href="#"+id;
    a.append(mk("b","",G[id].time),document.createTextNode(G[id].org));const nm=nameOf(id);a.appendChild(mk("span",nm?"":"empty",nm?nm+" さん":"未入力"));
    a.onclick=e=>{e.preventDefault();openTo(document.getElementById(id).closest("details.sec").id,id)};R.appendChild(a)});
}
function paintAll(){Object.keys(els).forEach(paint);totals();roster()}
function lineText(){
  const L=["【ホッチポッチ横浜 ゲスト】"];
  Object.keys(G).forEach(id=>{const v=state[id]||{};const nm=nameOf(id);
    L.push(`${v.done?"✓":"・"}${G[id].time} ${G[id].org}：${nm?nm+"さん":"未定"}${v.kana?"（"+v.kana+"）":""}${v.memo?" ／"+v.memo.replace(/\n/g," "):""}`)});
  L.push("","【確認結果】"); let n=0;
  Object.keys(els).forEach(id=>{if(els[id].guest)return;const v=state[id]||{};if(!v.done&&!v.memo)return;n++;
    L.push(`${v.done?"✓":"・"}${els[id].label}${v.memo?"\n　→ "+v.memo.replace(/\n/g," "):""}`)});
  if(!n)L.push("（まだ入力なし）");
  return L.join("\n");
}
function sendLine(){location.href="https://line.me/R/share?text="+encodeURIComponent(lineText())}
document.getElementById("send").onclick=sendLine;document.getElementById("send2").onclick=sendLine;

const pending={},busy={};
function save(id,v){
  state[id]=v; paint(id); totals(); roster();
  if(mode==="db"){ pending[id]=v; flush(id) } else { try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} }
}
async function flush(id){
  if(busy[id]||!pending[id])return; busy[id]=true;
  const v=pending[id]; delete pending[id];
  try{ await db.doc("checks/"+id).set({...v,at:Date.now()}); $("#sync").textContent="保存済み・共有中" }
  catch(e){ $("#sync").textContent= (e&&e.code==="permission_denied")?"閲覧のみ（入力は保存されません）":"保存できませんでした" }
  busy[id]=false; if(pending[id])flush(id);
}

build();
(function(){const b=mk("button","allbtn","すべて閉じる");b.type="button";
  b.onclick=()=>{const any=[...document.querySelectorAll("details.sec")].some(d=>d.open);document.querySelectorAll("details.sec").forEach(d=>d.open=!any);b.textContent=any?"すべて開く":"すべて閉じる"};
  $("#nav").prepend(b);
  const hh=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",hour:"numeric",hourCycle:"h23"}).format(new Date()));
  const cur=document.getElementById("s-"+hh); (cur||document.getElementById(hh<14?"s-14":"s-16")).open=true;
  const sync=()=>{b.textContent=[...document.querySelectorAll("details.sec")].some(d=>d.open)?"すべて閉じる":"すべて開く"};
  document.querySelectorAll("details.sec").forEach(d=>d.addEventListener("toggle",sync)); sync();
})();
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
for(const id in G){ if(G[id].pre && !state[id]) state[id]={...G[id].pre} }
for(const id in PRE){ if(!state[id]) state[id]={name:"",kana:"",...PRE[id]} }
paintAll();

(async()=>{
  let x=null; try{ x=await claude.use("db") }catch(e){}
  if(!x){ return }
  db=x; mode="db";
  const timer=setTimeout(()=>{$("#sync").textContent="共有データの読み込みに時間がかかっています"},10000);
  db.collection("checks").onSnapshot(snap=>{
    clearTimeout(timer);
    for(const k in state) if(!(k in pending)) delete state[k];
    snap.docs.forEach(d=>{ if(d.exists && !(d.id in pending)){const v=d.data();state[d.id]={done:!!v.done,memo:String(v.memo||""),name:String(v.name||""),kana:String(v.kana||"")}} });
    paintAll(); $("#sync").textContent="共有中"; $("#foot").textContent="入力はこのページを開いている全員で共有されます。";
  },e=>{clearTimeout(timer);$("#sync").textContent="共有データを読めません（この端末に保存）";mode="local"});
})();
</script>
